name: build
on:
  push: {branches: [main], paths: ["app/**", ".github/workflows/build.yml"]}
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd app && python -m unittest discover -s tests
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/jborgwardt/heilss:0.1.0
            ghcr.io/jborgwardt/heilss:latest
      - run: echo "digest=${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
